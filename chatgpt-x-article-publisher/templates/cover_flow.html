<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.055) 1.4px, transparent 1.4px);
    background-size: 28px 28px;
    mask-image: radial-gradient(80% 80% at 50% 50%, black 30%, transparent 85%);
  }
  .heading {
    font-size: 30px; font-weight: 800; color: #f3f4f7;
    margin-bottom: 46px; text-align: center; max-width: 80%;
    z-index: 2; position: relative;
  }
  .flow { display: flex; align-items: flex-start; gap: 0; z-index: 2; position: relative; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 220px; position: relative; }
  .icon-circle {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    border: 1.5px solid rgba(255,255,255,0.14);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 18px 40px rgba(0,0,0,0.35);
    font-size: 34px;
  }
  .label { font-size: 23px; font-weight: 700; letter-spacing: 0.02em; }
  .sublabel { font-size: 14px; color: #8b93a7; text-align: center; line-height: 1.4; max-width: 200px; }
  .arrow {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.35));
    position: relative; margin: 0 2px; margin-top: 42px;
  }
  .arrow::after {
    content: ""; position: absolute; right: -1px; top: 50%;
    width: 9px; height: 9px;
    border-top: 2px solid rgba(255,255,255,0.55);
    border-right: 2px solid rgba(255,255,255,0.55);
    transform: translateY(-50%) rotate(45deg);
  }
  .glow { position: absolute; width: 240px; height: 240px; border-radius: 50%; top: 50%; transform: translateY(-58%); filter: blur(6px); z-index: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid"></div>
    <div class="heading" id="heading" style="display:none;"></div>
    <div class="flow" id="flow"></div>
  </div>
<script>
const CONFIG = /*__CONFIG__*/{};

document.body.style.background = CONFIG.background ||
  'radial-gradient(120% 140% at 15% 15%, #182036 0%, #0c0f1a 55%, #08090f 100%)';

if (CONFIG.heading) {
  const h = document.getElementById('heading');
  h.textContent = CONFIG.heading;
  h.style.display = 'block';
}

const flow = document.getElementById('flow');
const nodes = CONFIG.nodes || [];
nodes.forEach((n, i) => {
  if (i > 0) {
    const arrow = document.createElement('div');
    arrow.className = 'arrow';
    flow.appendChild(arrow);
  }
  const node = document.createElement('div');
  node.className = 'node';

  const glow = document.createElement('div');
  glow.className = 'glow';
  glow.style.background = `radial-gradient(circle, ${n.color || '#8ab4ff'}29, transparent 70%)`;
  glow.style.left = (i === 0 ? -70 : i === nodes.length - 1 ? 70 : 0) + 'px';
  node.appendChild(glow);

  const circle = document.createElement('div');
  circle.className = 'icon-circle';
  circle.textContent = n.icon || '●';
  node.appendChild(circle);

  const label = document.createElement('div');
  label.className = 'label';
  label.style.color = n.color || '#8ab4ff';
  label.textContent = n.label || '';
  node.appendChild(label);

  if (n.sublabel) {
    const sub = document.createElement('div');
    sub.className = 'sublabel';
    sub.textContent = n.sublabel;
    node.appendChild(sub);
  }

  flow.appendChild(node);
});
</script>
</body>
</html>
